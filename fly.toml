app = "checkout-studio"
primary_region = "arn"

[build]
  builder = "paketobuildpacks/builder-jammy-base"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[deploy]
  release_command = "npx prisma migrate deploy"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
