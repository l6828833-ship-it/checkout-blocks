# Final Checkout Studio configuration for the Shopify app named: checkout styles
# Leave client_id blank. Shopify CLI writes the correct identifier after `shopify app config link`.
name = "checkout styles"
client_id = ""
application_url = "https://checkout-studio.fly.dev"
embedded = true

[build]
automatically_update_urls_on_dev = true

[access_scopes]
scopes = "read_checkout_and_accounts_configurations,write_checkout_and_accounts_configurations"

[auth]
redirect_urls = ["https://checkout-studio.fly.dev/api/shopify/auth/callback"]
